<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba · Itinerario</title>
  <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/panel.css">
  <script type="importmap">
    { "imports": { "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js": "./mock-db.js" } }
  </script>
</head>
<body>
  <main id="contenedor"><p>Cargando…</p></main>
  <div class="toast" id="toast" hidden></div>
  <script type="module">
    // Copia las pestañas y la sección Itinerario del panel real y la inicia con datos de prueba
    const html = await fetch('../panel.html').then((r) => r.text());
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const seccion = doc.querySelector('[data-solo="itin"]');
    seccion.hidden = false;
    document.getElementById('contenedor').replaceChildren(doc.getElementById('pestanas'), seccion);
    document.querySelector('[data-modo="itin"]').classList.add('activo');
    document.querySelector('[data-modo="pases"]').classList.remove('activo');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; setTimeout(() => { t.hidden = true; }, 2000); };
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js'); // carga la base falsa (mock-db.js)
    const ahora = Date.now();
    window.__datos.itinerario = {
      a: { hora: '19:30', momento: 'Entrada de la novia con su papá', cancion: 'Canción de ejemplo - Artista', enlace: 'https://youtube.com', hecho: false, creado: 1 },
      b: { hora: '18:30', momento: 'Llegada de invitados', hecho: true, creado: 2, notas: 'Música ambiental' },
    };
    const { iniciarItinerario } = await import('../js/itinerario.js');
    iniciarItinerario({ db: {}, esc, toast });
  </script>
</body>
</html>
