<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba · Gastos</title>
  <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/panel.css?v=23">
  <script type="importmap">
    { "imports": { "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js": "./mock-db.js" } }
  </script>
</head>
<body>
  <main id="contenedor"><p>Cargando…</p></main>
  <div class="toast" id="toast" hidden></div>
  <script type="module">
    // Copia el marcado de la sección Gastos del panel real y la inicia con datos de prueba
    const html = await fetch('../panel.html').then((r) => r.text());
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const seccion = doc.querySelector('[data-solo="gastos"]');
    seccion.hidden = false;
    document.getElementById('contenedor').replaceChildren(seccion);
    document.body.append(doc.getElementById('dlg-gasto'), doc.getElementById('dlg-abono'));
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; setTimeout(() => { t.hidden = true; }, 2000); };
    const { iniciarGastos } = await import('../js/gastos.js');
    iniciarGastos({ db: {}, esc, toast });
  </script>
</body>
</html>
