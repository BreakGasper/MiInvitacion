<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba · Pendientes</title>
  <link href="https://fonts.googleapis.com/css2?family=MonteCarlo&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/panel.css">
  <script type="importmap">
    { "imports": { "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js": "./mock-db.js" } }
  </script>
</head>
<body>
  <main id="contenedor"><p>Cargando…</p></main>
  <div class="toast" id="toast" hidden></div>
  <script type="module">
    // Copia las pestañas y la sección Pendientes del panel real y la inicia con datos de prueba
    const html = await fetch('../panel.html').then((r) => r.text());
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const seccion = doc.querySelector('[data-solo="pend"]');
    seccion.hidden = false;
    document.getElementById('contenedor').replaceChildren(doc.getElementById('pestanas'), seccion);
    document.querySelector('[data-modo="pend"]').classList.add('activo');
    document.querySelector('[data-modo="pases"]').classList.remove('activo');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.hidden = false; setTimeout(() => { t.hidden = true; }, 2000); };
    await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js'); // carga la base falsa (mock-db.js)
    const ahora = Date.now();
    window.__datos.pendientes = {
      a: { nombre: 'Antes de la boda', creada: ahora - 3000, items: {
        i1: { texto: 'Confirmar el menú con el salón', hecho: true, creado: ahora - 5000, fechaHecho: ahora - 1000 },
        i2: { texto: 'Imprimir las tarjetas de mesa con QR y revisar que todas tengan el número correcto', hecho: false, creado: ahora - 4000 },
        i3: { texto: 'Pagar el anticipo de la música', hecho: false, creado: ahora - 3500 },
      } },
      b: { nombre: 'Día del evento', creada: ahora - 2000, items: {
        j1: { texto: 'Llevar las argollas', hecho: true, creado: ahora - 5000, fechaHecho: ahora - 500 },
      } },
    };
    const { iniciarPendientes } = await import('../js/pendientes.js');
    iniciarPendientes({ db: {}, esc, toast });
  </script>
</body>
</html>
